<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#397700" />
    <title>FoodieHub · Offline</title>
    <style>
      :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; background: #fcf9f2; color: #1c1c18; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 440px); text-align: center; background: #fff; border: 1px solid #ede6d5; border-radius: 28px; padding: 42px 28px; box-shadow: 0 18px 50px rgba(57, 106, 0, .12); }
      .icon { width: 76px; height: 76px; display: grid; place-items: center; margin: 0 auto 20px; border-radius: 24px; background: #dceecb; color: #396a00; font-size: 38px; }
      h1 { margin: 0 0 12px; font-size: 28px; }
      p { margin: 0 auto 24px; line-height: 1.6; color: #5d6456; }
      button { border: 0; border-radius: 999px; padding: 13px 24px; background: #396a00; color: #fff; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="icon">⌁</div>
      <h1>You’re offline</h1>
      <p>FoodieHub is temporarily disconnected from the local network. Reconnect to Wi‑Fi and try again. Cached information on this device is still safe.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
